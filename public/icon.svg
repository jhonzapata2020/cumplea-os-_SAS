<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="lavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
  </defs>

  <!-- Fondo circular redondeado -->
  <rect x="5" y="5" width="90" height="90" rx="28" fill="url(#lavenderGrad)" />
  <rect x="7" y="7" width="86" height="86" rx="26" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.8" />

  <!-- Corona de Quinceañera -->
  <path d="M 25,65 L 20,38 L 36,48 L 50,28 L 64,48 L 80,38 L 75,65 Z" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Joyas de la corona -->
  <circle cx="20" cy="38" r="3.5" fill="#FFFFFF" />
  <circle cx="50" cy="28" r="4.5" fill="#FFFFFF" />
  <circle cx="80" cy="38" r="3.5" fill="#FFFFFF" />
  
  <circle cx="36" cy="48" r="2.5" fill="#FFFFFF" opacity="0.9" />
  <circle cx="64" cy="48" r="2.5" fill="#FFFFFF" opacity="0.9" />

  <!-- Corazón base -->
  <path d="M 50,60 C 47,56 42,54 42,50 C 42,47 45,45 48,46 C 49.5,46.5 50,48 50,48 C 50,48 50.5,46.5 52,46 C 55,45 58,47 58,50 C 58,54 53,56 50,60 Z" fill="#FFF0F5" opacity="0.95" />
</svg>
